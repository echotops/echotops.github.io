<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/global/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Ethan Rosenfeld — Mechanical Engineering and Physics at Duke, propulsion engineer at DukeAERO, instrument-rated pilot, and builder of interactive physics simulations." />
        <title>Ethan Rosenfeld</title>
        <script>
        const redirect = sessionStorage.getItem('redirect');
        if (redirect) {
            sessionStorage.removeItem('redirect');
            // GitHub Pages 301s any path that matches a real folder in the
            // build (e.g. /projects, since public/projects holds the
            // project images) to "/projects/" before serving 404.html, so the
            // saved path can arrive with a trailing slash. The app compares
            // against exact paths like "/projects", so strip it here.
            const url = new URL(redirect, window.location.origin);
            url.pathname = url.pathname.replace(/\/+$/, '') || '/';
            window.history.replaceState(null, '', url.pathname + url.search + url.hash);
        }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
